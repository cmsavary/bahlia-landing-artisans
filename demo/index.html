<style>

.bahlia-demo-root{position:relative;width:100%;aspect-ratio:16/10;overflow:hidden;border-radius:24px;background:#A9E0D8;container-type:inline-size;box-shadow:0 10px 36px rgba(36,18,77,.18)}

.bahlia-demo-layer{position:absolute;inset:0;pointer-events:none}

/* verre : uniquement sur les contrôles */
.bahlia-demo-glass{background:rgba(255,247,234,.6);-webkit-backdrop-filter:blur(14px) saturate(1.5);backdrop-filter:blur(14px) saturate(1.5);border:1px solid rgba(255,255,255,.8);box-shadow:0 6px 22px rgba(36,18,77,.16),inset 0 1px 0 rgba(255,255,255,.95)}

.bahlia-demo-top{position:absolute;top:1.6cqw;left:1.6cqw;right:1.6cqw;display:flex;align-items:center;gap:1.2cqw;padding:.7cqw 1.2cqw;border-radius:999px;font-family:'Fredoka',system-ui,sans-serif;font-weight:600;color:#24124D;font-size:clamp(11px,1.7cqw,20px)}

.bahlia-demo-spacer{flex:1}
.bahlia-demo-badge{font-family:'Nunito',system-ui,sans-serif;font-weight:700;font-size:clamp(9px,1.25cqw,14px);padding:.3cqw 1cqw;border-radius:999px;background:#FFC93C;color:#24124D;white-space:nowrap}

@media (prefers-reduced-motion: reduce){.bahlia-demo-bubble{animation:none}}
</style>

<body>
<div class="bahlia-demo-page">
  <h1 class="bahlia-demo-h1">BahliA · une équipe d'agents IA</h1>
  <div class="bahlia-demo-root" id="bahlia-demo-root" role="group" aria-label="Démo animée fictive : un village isométrique où des agents IA, un par département, se passent une campagne de service en service.">

    <div class="bahlia-demo-layer" id="bahlia-demo-labels"></div>

    <header class="bahlia-demo-top bahlia-demo-glass">
      <svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="20" fill="#FF7A1A"/><circle cx="20" cy="20" r="9" fill="#FFC93C"/><path d="M4 28c6-5 10 3 16-2s10 3 16-2" fill="none" stroke="#19C2B4" stroke-width="3.2" stroke-linecap="round"/></svg>

  </div>
  <noscript><p class="bahlia-demo-noscript">Cette démo animée demande JavaScript.</p></noscript>
</div>

<script>
(function(){
'use strict';

/* ------------------------------------------------------------------ */
/* Réglages                                                           */
/* ------------------------------------------------------------------ */

function $(id){return document.getElementById('bahlia-demo-'+id);}

/* Texte de secours : identique à scenario.json (utilisé si le fichier ne charge pas, ex. ouverture en file://) */
var FALLBACK={"enabled":["direction","strategie","contenu","design","presentation","ventes","rh","compta"],"departments":{"direction":{"label":"Direction","sub":"Orchestre l'équipe","idle":1,"active":2},"strategie":{"label":"Stratégie","sub":"Briefs","idle":0,"active":3},"contenu":{"label":"Contenu","sub":"Posts et carrousels","idle":0,"active":4},"design":{"label":"Design","sub":"Visuels","idle":0,"active":5},"presentation":{"label":"Présentation","sub":"Decks","idle":0,"active":2},"ventes":{"label":"Ventes","sub":"Prospects","idle":2,"active":3},"rh":{"label":"RH","sub":"Candidats et CV","idle":1,"active":2},"compta":{"label":"Compta","sub":"Factures et relances","idle":2,"active":3}},"ui":{"title":"BahliA · une campagne en direct","badge":"Démo fictive","placeholder":"Donne une mission à Stratégie…","launch":"Lancer","pause":"Pause","resume":"Reprendre","replay":"Rejouer","statusOn":"En cours","statusWait":"En attente","list":"Départements"},"handoff":"Je passe le relais à {to}","steps":[{"dept":"direction","say":"Brief reçu : campagne d'été pour un client","work":4},{"dept":"strategie","say":"Je choisis l'angle et le message clé","work":5},{"dept":"contenu","say":"J'écris les posts et le carrousel","work":5},{"dept":"design","say":"Je dessine les visuels de la campagne","work":5},{"dept":"presentation","say":"J'assemble le deck client","work":5}],"finish":{"default":"Deck client prêt","design":"Visuels prêts pour validation","presentation":"Deck client prêt"},"finishWork":4,"background":{"ventes":["Prospect qualifié","Relance préparée","Rendez-vous planifié"],"rh":["CV analysé","Candidat présélectionné","Offre rédigée"],"compta":["Facture envoyée","Relance programmée","Paiement reçu"]}};

/* Charte (valeurs relevées dans index.html du site) */
var C={indigo:'#24124D',indigo2:'#3A2480',violet:'#4B3A78',lav:'#EDE6FF',lav2:'#B9A2F5',cream:'#FFF7EA',cream2:'#FFF4DC',yellow:'#FFC93C',teal:'#19C2B4',orange:'#FF7A1A',rose:'#F7B6C2',purple:'#5B2FC4'};

/* ------------------------------------------------------------------ */
/* Outils                                                             */
/* ------------------------------------------------------------------ */
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
var R=rng(20261109);
function h2r(h){h=h.replace('#','');return [parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)];}
function mix(a,b,t){var A=h2r(a),B=h2r(b);return '#'+[0,1,2].map(function(i){var v=Math.round(A[i]+(B[i]-A[i])*t);return (v<16?'0':'')+v.toString(16);}).join('');}
function dark(c,t){return mix(c,'#24124D',t);}
function light(c,t){return mix(c,'#FFFFFF',t);}
function mkc(w,h){var c=document.createElement('canvas');c.width=w;c.height=h;var x=c.getContext('2d');x.imageSmoothingEnabled=false;return [c,x];}
function rect(x,c,a,b,w,h){x.fillStyle=c;x.fillRect(Math.round(a),Math.round(b),w,h);}
function bres(x0,y0,x1,y1,cb){x0=Math.round(x0);y0=Math.round(y0);x1=Math.round(x1);y1=Math.round(y1);var dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1,e=dx+dy;for(;;){cb(x0,y0);if(x0===x1&&y0===y1)break;var e2=2*e;if(e2>=dy){e+=dy;x0+=sx;}if(e2<=dx){e+=dx;y0+=sy;}}}
function line(x,c,x0,y0,x1,y1){x.fillStyle=c;bres(x0,y0,x1,y1,function(a,b){x.fillRect(a,b,1,1);});}
function poly(x,c,pts){x.fillStyle=c;var mn=1e9,mx=-1e9,i,k;for(i=0;i<pts.length;i++){mn=Math.min(mn,pts[i][1]);mx=Math.max(mx,pts[i][1]);}
  for(var y=Math.ceil(mn-.5);y<=Math.floor(mx-.5);y++){var yy=y+.5,xs=[];for(k=0;k<pts.length;k++){var p=pts[k],q=pts[(k+1)%pts.length];if((p[1]<=yy&&q[1]>yy)||(q[1]<=yy&&p[1]>yy)){xs.push(p[0]+(yy-p[1])/(q[1]-p[1])*(q[0]-p[0]));}}
    xs.sort(function(a,b){return a-b;});for(var m=0;m+1<xs.length;m+=2){var x0=Math.round(xs[m]),x1=Math.round(xs[m+1]);if(x1>x0)x.fillRect(x0,y,x1-x0,1);}}}
function ell(x,c,cx,cy,rx,ry){x.fillStyle=c;for(var dy=-ry;dy<=ry;dy++){var w=Math.round(rx*Math.sqrt(Math.max(0,1-(dy*dy)/(ry*ry+.01))));x.fillRect(Math.round(cx-w),Math.round(cy+dy),2*w+1,1);}}
function disc(x,c,cx,cy,r){ell(x,c,cx,cy,r,r);}
function outline(cv,col){var x=cv.getContext('2d'),w=cv.width,h=cv.height,d=x.getImageData(0,0,w,h),s=d.data,o=x.createImageData(w,h),t=o.data,rgb=h2r(col);
  for(var y=0;y<h;y++)for(var xx=0;xx<w;xx++){var i=(y*w+xx)*4;if(s[i+3]>0){t[i]=s[i];t[i+1]=s[i+1];t[i+2]=s[i+2];t[i+3]=s[i+3];}else{
    var n=(xx>0&&s[i-1]>0)||(xx<w-1&&s[i+7]>0)||(y>0&&s[i-w*4+3]>0)||(y<h-1&&s[i+w*4+3]>0);if(n){t[i]=rgb[0];t[i+1]=rgb[1];t[i+2]=rgb[2];t[i+3]=190;}}}
  x.putImageData(o,0,0);}
function iso(i,j){return [OX+(i-j)*8,OY+(i+j)*4];}

/* ------------------------------------------------------------------ */
/* Bâtiments : boîte isométrique + façade + toits                      */
/* ------------------------------------------------------------------ */
function box(x,bx,by,a,b,h,cl,cr,ct){
  var T=[bx,by-h],Rr=[bx+a*8,by+a*4-h],B=[bx+(a-b)*8,by+(a+b)*4-h],L=[bx-b*8,by+b*4-h];
  poly(x,cl,[L,B,[B[0],B[1]+h],[L[0],L[1]+h]]);
  poly(x,cr,[B,Rr,[Rr[0],Rr[1]+h],[B[0],B[1]+h]]);
  poly(x,ct,[T,Rr,B,L]);
  line(x,light(ct,.55),L[0],L[1],B[0],B[1]);line(x,light(ct,.55),B[0],B[1],Rr[0],Rr[1]);
  line(x,dark(cl,.28),B[0],B[1]+1,B[0],B[1]+h);
  return {T:T,R:Rr,B:B,L:L};
}
function hip(x,bx,by,a,b,h,r,c){
  var T=[bx,by-h],Rr=[bx+a*8,by+a*4-h],B=[bx+(a-b)*8,by+(a+b)*4-h],L=[bx-b*8,by+b*4-h];
  var A=[(T[0]+B[0])/2,(T[1]+B[1])/2-r];
  poly(x,dark(c,.38),[L,T,A]);poly(x,dark(c,.3),[T,Rr,A]);
  poly(x,c,[L,B,A]);poly(x,dark(c,.2),[B,Rr,A]);
  for(var t=.25;t<.95;t+=.25){
    line(x,dark(c,.16),L[0]+(A[0]-L[0])*t,L[1]+(A[1]-L[1])*t,B[0]+(A[0]-B[0])*t,B[1]+(A[1]-B[1])*t);
    line(x,dark(c,.34),B[0]+(A[0]-B[0])*t,B[1]+(A[1]-B[1])*t,Rr[0]+(A[0]-Rr[0])*t,Rr[1]+(A[1]-Rr[1])*t);
  }
  line(x,light(c,.45),L[0],L[1],B[0],B[1]);line(x,light(c,.25),B[0],B[1],Rr[0],Rr[1]);
  return A;
}
function dome(x,cx,cy,rr,c){
  ell(x,dark(c,.35),cx,cy,rr,Math.round(rr/2));
  for(var dy=-rr;dy<=0;dy++){var w=Math.round(rr*Math.sqrt(1-(dy/rr)*(dy/rr)));x.fillStyle=c;x.fillRect(cx-w,cy+dy,2*w+1,1);var k=Math.round(w*.3);x.fillStyle=dark(c,.2);x.fillRect(cx+k,cy+dy,w-k+1,1);}
  rect(x,light(c,.7),cx-Math.round(rr*.5),cy-Math.round(rr*.72),2,2);
}
function sun(x,cx,cy,r){
  for(var k=0;k<8;k++){var an=k*Math.PI/4;line(x,C.orange,cx+Math.cos(an)*(r+1.5),cy+Math.sin(an)*(r+1.5),cx+Math.cos(an)*(r+3.5),cy+Math.sin(an)*(r+3.5));}
  disc(x,C.yellow,cx,cy,r);rect(x,'#FFF0B0',cx-1,cy-2,2,1);
}
/* repères de mur : L0 = coin gauche bas, R0 = coin droit bas */
function wallPts(bx,by,a,b){return {L0:[bx-b*8,by+b*4],R0:[bx+a*8,by+a*4]};}
function winL(x,P,u,hp,w,hh,glass,frame){for(var k=0;k<w;k++){var d=u+k,xx=P.L0[0]+d,yb=Math.round(P.L0[1]+(d+.5)/2);
  for(var r=0;r<hh;r++){x.fillStyle=(k===0||k===w-1||r===0)?frame:glass;x.fillRect(xx,yb-hp-hh+r,1,1);}
  rect(x,light(frame,.5),xx,yb-hp,1,1);}rect(x,'#FFFFFF',P.L0[0]+u+1,Math.round(P.L0[1]+(u+1.5)/2)-hp-hh+1,1,1);}
function winR(x,P,u,hp,w,hh,glass,frame){for(var k=0;k<w;k++){var d=u+k,xx=P.R0[0]-1-d,yb=Math.round(P.R0[1]+(d+.5)/2);
  for(var r=0;r<hh;r++){x.fillStyle=(k===0||k===w-1||r===0)?frame:glass;x.fillRect(xx,yb-hp-hh+r,1,1);}

$('pause').textContent=S.ui.pause;$('replay').textContent=S.ui.replay;$('listtitle').textContent=S.ui.list;

var land=[];for(i=0;i<N;i++){land.push(new Uint8Array(N));}
for(i=0;i<N;i++)for(j=0;j<N;j++){var c=iso(i+.5,j+.5),e=Math.pow((c[0]-320)/292,2)+Math.pow((c[1]-226)/140,2);
  var nz=Math.sin(i*.55+1)*Math.cos(j*.47)+.6*Math.sin((i+j)*.33);land[i][j]=e<1+.10*nz?1:0;}
function nb(i,j){return (i>0&&land[i-1][j]?1:0)+(i<N-1&&land[i+1][j]?1:0)+(j>0&&land[i][j-1]?1:0)+(j<N-1&&land[i][j+1]?1:0);}
for(var pass=0;pass<2;pass++)for(i=0;i<N;i++)for(j=0;j<N;j++){if(land[i][j]&&nb(i,j)<2)land[i][j]=0;}
for(i=0;i<N;i++)for(j=0;j<N;j++){if(!land[i][j]&&nb(i,j)>=3)land[i][j]=1;}
enabled.forEach(function(id){var b=blds[id];for(var p=b.i0-1;p<=b.i0+b.a;p++)for(var q=b.j0-1;q<=b.j0+b.b+1;q++){if(p>=0&&q>=0&&p<N&&q<N&&!land[p][q]){land[p][q]=1;}}});

/* ---------- Chemins (A* avec pénalité de virage) ---------- */
function Heap(){this.a=[];}
Heap.prototype.push=function(k,v){var a=this.a;a.push([k,v]);var n=a.length-1;while(n>0){var p=(n-1)>>1;if(a[p][0]<=a[n][0])break;var t=a[p];a[p]=a[n];a[n]=t;n=p;}};

var DIRS=[[1,0],[0,1],[-1,0],[0,-1]];
function astar(s,g){
  var INF=1e9,dist=new Float32Array(N*N*5).fill(INF),prev=new Int32Array(N*N*5).fill(-1),h=new Heap();
  function id(p,q,d){return (p*N+q)*5+d;}
  var s0=id(s[0],s[1],4);dist[s0]=0;h.push(0,s0);var end=-1;

    if(p===g[0]&&q===g[1]){end=cur;break;}

      else{bob=0;}
      ctx.globalAlpha=.22;ctx.fillStyle=C.indigo;ctx.beginPath();ctx.ellipse(Math.round(s[0]),Math.round(s[1]),5,2,0,0,6.3);ctx.fill();ctx.globalAlpha=1;
      var spt=getAgentSprite(a.id,back,fr),x0=Math.round(s[0]),y0=Math.round(s[1])+bob-17;
      if(flip){ctx.save();ctx.translate(x0+6,y0);ctx.scale(-1,1);ctx.drawImage(spt,0,0);ctx.restore();}else ctx.drawImage(spt,x0-6,y0);
      if(a.mv&&a.mv.lit){ctx.fillStyle='#FFFFFF';ctx.fillRect(x0+(flip?-8:5),y0+8,4,5);ctx.fillStyle=C.orange;ctx.fillRect(x0+(flip?-8:5),y0+8,4,1);}
      bubblePos[a.id]=[s[0],y0-1];}
  });
  /* confettis */
  conf.forEach(function(c){ctx.fillStyle=c.c;ctx.globalAlpha=Math.min(1,c.life);ctx.fillRect(Math.round(c.x),Math.round(c.y),2,2);});ctx.globalAlpha=1;
  /* nuages */
  clouds.forEach(function(c){var x=((c.x+T*c.v)%(W+120))-60;ctx.globalAlpha=.92;ctx.drawImage(c.s,Math.round(x),c.y);});ctx.globalAlpha=1;
  /* bulles */
  for(var bid in bubbles){var bp=bubblePos[bid];if(!bp)continue;var el=bubbles[bid].el;el.style.left=Math.max(10,Math.min(90,bp[0]/W*100))+'%';el.style.top=(bp[1]-2)/H*100+'%';}
}

/* ---------- Boucle d'animation ---------- */
var last=0,visible=true;
function frame(ts){requestAnimationFrame(frame);var dt=Math.min(.05,(ts-last)/1000||0);last=ts;if(!visible)return;if(!sim.paused)update(dt);draw();}
if('IntersectionObserver' in window){new IntersectionObserver(function(en){visible=en[0].isIntersecting;}).observe($('root'));}
document.addEventListener('visibilitychange',function(){if(document.hidden)visible=false;else visible=true;});
requestAnimationFrame(frame);

/* ---------- Boutons ---------- */
$('launch').addEventListener('click',function(){sim.paused=false;$('pause').textContent=S.ui.pause;startLoop();});
$('replay').addEventListener('click',function(){sim.paused=false;$('pause').textContent=S.ui.pause;startLoop();});
$('pause').addEventListener('click',function(){sim.paused=!sim.paused;this.textContent=sim.paused?S.ui.resume:S.ui.pause;});
window.__bahlia={sim:sim,agents:agents,blds:blds,land:land};
startLoop();
}
})();
</script>
