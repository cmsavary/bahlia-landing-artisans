server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/html text/css text/xml text/vtt application/json image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
    }

    # Sous-titres : type attendu par les navigateurs
    location ~ \.vtt$ {
        default_type text/vtt;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Pages : cache court (5 min), pour que les modifications soient visibles vite
    location ~* \.(html|xml|txt)$ {
        add_header Cache-Control "public, max-age=300";
    }

    # Vidéos, images, polices : cache d'un mois (changer le nom du fichier pour une nouvelle version)
    location ~* \.(mp4|jpg|woff2)$ {
        add_header Cache-Control "public, max-age=2592000";
    }
}
